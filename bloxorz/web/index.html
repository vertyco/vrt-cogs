<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bloxorz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- The original's 550 by 300 stage, scaled to fit the window between black bars -->
    <main id="stage"></main>
    <p id="toast" role="status" hidden></p>
    <!-- The Load Stage passcode box: shown over the original's passcode field, so phones bring up their keyboard -->
    <input
      id="passcode-input"
      type="text"
      inputmode="numeric"
      maxlength="6"
      autocomplete="off"
      spellcheck="false"
      aria-label="Passcode"
      hidden
    />
    <button type="button" id="back" aria-label="Back to the menu" title="Back to the menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19" /></svg>
    </button>
    <!-- The hub's people button, over the stage's bottom right corner where the sponsor link was -->
    <div id="people"></div>
    <!-- Changes between the two small blocks on a touch screen; sits beside or below the stage, never over it -->
    <button type="button" id="switch" hidden>Switch</button>
    <script type="module" src="game.js"></script>
  </body>
</html>
