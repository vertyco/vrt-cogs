<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bot Arena 3</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- The original's 640 by 480 stage, scaled to fit the window between black bars -->
    <main id="stage"></main>
    <p id="toast" role="status" hidden></p>
    <!-- Typing into the robot name box: shown over the box, so phones bring up their keyboard -->
    <input
      id="name-input"
      type="text"
      maxlength="17"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
      aria-label="TITLE"
      hidden
    />
    <button type="button" id="back" aria-label="Back to the menu" title="Back to the menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19" /></svg>
    </button>
    <!-- The hub's people button, in the top right corner of the black bars as the back button is in the top left -->
    <div id="people"></div>
    <!-- The faces of the people watching the battle on the screen, in the black bars beside or above it -->
    <div id="watchers" hidden></div>
    <script type="module" src="game.js"></script>
  </body>
</html>
