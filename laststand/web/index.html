<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Last Stand: Union City</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- The original's 760 by 400 stage, scaled to fit the window between black bars -->
    <main id="stage"></main>
    <p id="loading" role="status">Loading...</p>
    <button type="button" id="back" aria-label="Back to the menu" title="Back to the menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19" /></svg>
    </button>
    <!-- The hub's people button, placed by game.js -->
    <div id="people"></div>
    <script type="module" src="game.js"></script>
  </body>
</html>
